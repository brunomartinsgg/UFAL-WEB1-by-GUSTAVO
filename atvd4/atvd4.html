<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Flexbox</title>
    <link rel="stylesheet" href="atvd4.css">
</head>
<body>

    <h2>Layout 1</h2>
    <div class="layout layout-1">
        <header>TOPO</header>
        <nav>MENU</nav>
        <section>CONTEÚDO</section>
        <footer>RODAPÉ</footer>
    </div>

    <h2>Layout 2</h2>
    <div class="layout layout-2">
        <header>TOPO</header>
        <main>
            <aside>LATERAL ESQUERDA</aside>
            <section>CONTEÚDO</section>
        </main>
        <footer>RODAPÉ</footer>
    </div>

    <h2>Layout 3</h2>
    <div class="layout layout-3">
        <header>TOPO</header>
        <main>
            <aside>LATERAL ESQUERDA</aside>
            <section>CONTEÚDO</section>
            <aside>LATERAL DIREITA</aside>
        </main>
        <footer>RODAPÉ</footer>
    </div>

    <h2>Layout 4</h2>
    <div class="layout layout-4">
        <aside>LATERAL ESQUERDA</aside>
        <section>CONTEÚDO</section>
        <aside>LATERAL DIREITA</aside>
    </div>

</body>
</html>
